[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "picrecall"
version = "0.1.1"
description = "本地截图文字检索库：对截图文件夹做 OCR 索引，按图中文字秒级搜回那张图（增量索引 + 重复截图建议）"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yuluo554" }]
keywords = ["ocr", "screenshot", "full-text-search", "sqlite-fts5", "local-first", "privacy"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Utilities",
]
dependencies = [
  "Pillow>=9",
  "imagehash>=4.3",
  "numpy>=1.19.5",
]

[project.optional-dependencies]
ocr = [
  "rapidocr-onnxruntime==1.4.4",
  "onnxruntime>=1.7",
]
dev = [
  "pytest>=7",
]

[project.scripts]
picrecall = "picrecall.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
