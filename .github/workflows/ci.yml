name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.8" }
          - { os: windows-latest, python: "3.12" }
          - { os: ubuntu-latest,  python: "3.12" }
    env:
      # 编码守卫：CI 里 `python -m pytest` 不是我们敲的命令、没有 -X utf8
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install (extras 通路；requirements.txt 入口见 test-requirements-entry 作业)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Selftest (核心依赖通路)
        run: python -m picrecall selftest

      - name: CLI 冒烟 — 裸 console script 通路
        run: |
          picrecall --version
          picrecall selftest

      - name: 三条命令闭环冒烟
        shell: bash
        run: |
          mkdir -p smoke/shots
          python -c "from PIL import Image; Image.new('RGB',(200,80),'white').save('smoke/shots/a.png')"
          picrecall index smoke/shots --db smoke/i.db
          picrecall search hello --db smoke/i.db
          picrecall dedupe --db smoke/i.db --out smoke/keep.csv

      - name: Pytest (全量)
        run: python -m pytest -q

  test-ocr:
    name: ${{ matrix.os }} · py${{ matrix.python }} · with OCR
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.12" }
          - { os: ubuntu-latest,  python: "3.12" }
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install with OCR extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ocr]"

      # M6 首推实测：ubuntu runner 不带任何 CJK 字体（fonts-noto-cjk 缺席），
      # 合成图渲染会落 DejaVu → 豆腐块 → 识别率 0.21。字体是基准的前置数据。
      - name: Install CJK fonts (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Selftest requiring OCR
        run: python -m picrecall selftest --require-ocr

      # M6 首推实测：count=8 只有 14 行样本，0.90 门槛容不下跨机器 OCR 的 2 行波动
      # （windows 首轮 0.8571 打红）。升到 24 图（≈47 行）给统计量留余量。
      - name: 端到端 — 合成集 → 索引 → OCR → 检索 → 基准对账
        shell: bash
        run: |
          python -m picrecall bench gen --data data --out smoke/synth --count 24
          python -m picrecall index smoke/synth --db smoke/b.db
          python -m picrecall ocr --db smoke/b.db
          python -m picrecall search 账单 --db smoke/b.db
          python -m picrecall bench run --db smoke/b.db --data smoke/synth

      - name: 基准可证伪探活（注入缺陷必须打红）
        shell: bash
        run: |
          if python -m picrecall bench run --db smoke/b.db --data smoke/synth --inject-defect ocr_drop; then
            echo "::error::注入缺陷后基准仍然通过 = 假门"; exit 1
          fi
          echo "注入缺陷后基准正确报未达标"

  test-requirements-entry:
    name: ${{ matrix.os }} · py${{ matrix.python }} · requirements.txt 入口
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python: "3.12" }
          - { os: ubuntu-latest,  python: "3.12" }
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 题目文档 §四 ① 的安装入口是 requirements.txt（既不是 extras）。
      # 本作业在**干净 venv** 里验证该入口装完即闭环——M5 实测发现它曾只装依赖、
      # 不装项目本身（没有 picrecall 命令、python -m picrecall 报 ModuleNotFoundError）。
      - name: 干净 venv + 只跑 pip install -r requirements.txt
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/reqvenv"
          if [ -x "$RUNNER_TEMP/reqvenv/bin/python" ]; then
            REQPY="$RUNNER_TEMP/reqvenv/bin/python"
          else
            REQPY="$RUNNER_TEMP/reqvenv/Scripts/python.exe"
          fi
          "$REQPY" -m pip install --upgrade pip
          "$REQPY" -m pip install -r requirements.txt
          echo "REQPY=$REQPY" >> "$GITHUB_ENV"

      - name: 入口探活 — 包与 console script 都得在
        shell: bash
        run: |
          "$REQPY" -c "import picrecall; print('import ok:', picrecall.__file__)"
          "$REQPY" -m picrecall --version
          REQBIN="$(dirname "$REQPY")"
          if [ -f "$REQBIN/picrecall.exe" ] || [ -f "$REQBIN/picrecall" ]; then
            echo "console script 已生成"
          else
            echo "::error::requirements.txt 装完没有 picrecall console script"; exit 1
          fi

      - name: 快速开始闭环（照 README 逐条，exit 2 = 失败）
        shell: bash
        run: |
          set -e
          mkdir -p smoke/shots
          "$REQPY" -c "from PIL import Image; Image.new('RGB',(200,80),'white').save('smoke/shots/a.png')"
          run_or_fail() {  # 只允许声明的语义；exit 2/裸崩一律算失败
            set +e; "$@"; rc=$?; set -e
            if [ "$rc" -eq 2 ]; then echo "::error::用法错误（exit 2）: $*"; exit 1; fi
            if [ "$rc" -gt 3 ]; then echo "::error::非契约退出码 $rc: $*"; exit 1; fi
            return 0
          }
          run_or_fail "$REQPY" -m picrecall index smoke/shots --db smoke/req.db
          run_or_fail "$REQPY" -m picrecall ocr --db smoke/req.db
          run_or_fail "$REQPY" -m picrecall search hello --db smoke/req.db
          run_or_fail "$REQPY" -m picrecall dedupe --db smoke/req.db --out smoke/req-keep.csv
          run_or_fail "$REQPY" -m picrecall bench gen --data data --out smoke/synth --count 8
          run_or_fail "$REQPY" -m picrecall bench gen --check --data data --out smoke/synth --count 8
 
      - name: Pytest（同一干净 venv；dev 依赖另装）
        shell: bash
        run: |
          "$REQPY" -m pip install -e ".[dev]"
          "$REQPY" -m pytest -q
